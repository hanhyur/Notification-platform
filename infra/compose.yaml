services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME을 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정하세요}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-replication-setup:
    image: postgres:18.6
    profiles: [replica]
    user: postgres
    entrypoint: ["/bin/bash", "/opt/replication/prepare-primary.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/prepare-primary.sh:/opt/replication/prepare-primary.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres-replica:
    image: postgres:18.6
    profiles: [replica]
    user: postgres
    entrypoint: ["/bin/bash", "/opt/replication/start-standby.sh"]
    environment:
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:-}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_REPLICA_PORT:-5433}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql
      - ./postgres/start-standby.sh:/opt/replication/start-standby.sh:ro
    depends_on:
      postgres-replication-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    profiles: [kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  postgres_replica_data:
  kafka_data:
