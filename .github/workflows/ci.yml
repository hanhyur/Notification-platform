name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'

      - name: Check local certificate creation and reuse
        run: bash infra/https/test-prepare-local-cert.sh

      - name: Test and build the executable JAR
        working-directory: backend
        run: ./gradlew --no-daemon clean test bootJar

      - name: Upload the tested JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: notification-backend-${{ github.sha }}
          path: |
            backend/build/libs/*.jar
            !backend/build/libs/*-plain.jar
          if-no-files-found: error
