server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

notification:
  dispatch:
    provider:
      endpoint: ${NOTIFICATION_DISPATCH_PROVIDER_ENDPOINT:http://127.0.0.1:8091/deliveries}

logging:
  level:
    root: info
    me.hanhyur.notify: debug
