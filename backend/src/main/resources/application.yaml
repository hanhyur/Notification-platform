server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: SESSION
        path: /
        http-only: true
        same-site: lax
        secure: true

spring:
  application:
    name: backend
  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

notification:
  database:
    slow-query-threshold: ${DB_SLOW_QUERY_THRESHOLD:500ms}
    replica:
      url: ${DB_REPLICA_URL:}
      username: ${DB_REPLICA_USERNAME:}
      password: ${DB_REPLICA_PASSWORD:}
  query:
    cursor-signing-key: ${NOTIFICATION_QUERY_CURSOR_SIGNING_KEY:}
  dispatch:
    provider:
      connect-timeout: 2s
      response-timeout: 5s
    consumer:
      enabled: false
      group-id: notification-dispatch-worker
      concurrency: 4
    pool:
      workers: 2
      queue-capacity: 2
  outbox:
    polling:
      enabled: false
      fixed-delay: 5s
      batch-size: 50
    kafka:
      topic: notification.dispatch.v1
      ack-timeout: 10s
